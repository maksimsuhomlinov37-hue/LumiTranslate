
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LumiTranslate</title>
    <!-- Фавикон: замените href на свой логотип -->
    <link rel="icon" type="image/svg+xml" href="LumiTranslate-Favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f1f4f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        body.dark {
            background: #0b0e14;
            color: #e8edf5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px 24px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* ===== ЛОГОТИП: замените текст L на <img src="..." /> ===== */
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            background: #2563ff;
            color: #fff;
            box-shadow: 0 4px 14px rgba(37, 99, 255, 0.2);
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }
        .logo-text span { color: #2563ff; }
        .theme-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid #dce1e9;
            background: #fff;
            color: #4a5268;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .dark .theme-btn {
            background: #1a1f2e;
            border-color: #2c3346;
            color: #b0b8cc;
        }
        .theme-btn:hover {
            background: #f0f2f5;
            transform: scale(0.96);
        }
        .dark .theme-btn:hover { background: #262d42; }
        .theme-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
            border: 1px solid #eef0f5;
            overflow: hidden;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .dark .card {
            background: #131824;
            border-color: #242b3f;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .lang-bar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #eef0f5;
            padding: 8px 14px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .dark .lang-bar { border-color: #242b3f; }
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            border: 1px solid #dce1e9;
            background: #f8fafc;
            transition: 0.2s;
            height: 34px;
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            user-select: none;
            flex: 1 1 140px;
            min-width: 100px;
            justify-content: space-between;
        }
        .dark .lang-selector {
            background: #1a1f2e;
            border-color: #2c3346;
            color: #e8edf5;
        }
        .lang-selector:hover { border-color: #2563ff; }
        .lang-selector .arrow { margin-left:4px; opacity:0.6; }
        .lang-selector .arrow svg {
            width:14px; height:14px;
            stroke:currentColor; stroke-width:2; fill:none;
        }
        .swap-btn {
            width:34px; height:34px; border-radius:50%;
            border:1px solid #dce1e9; background:#fff;
            color:#2563ff; display:flex; align-items:center; justify-content:center;
            cursor:pointer; flex-shrink:0; transition:0.2s;
        }
        .dark .swap-btn { background:#131824; border-color:#2c3346; }
        .swap-btn:hover { background:#f0f2f5; transform:scale(0.92); }
        .dark .swap-btn:hover { background:#1f263a; }
        .swap-btn svg {
            width:18px; height:18px;
            stroke:currentColor; stroke-width:2; fill:none;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 260px;
            flex: 1;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns:1fr; min-height:380px; }
            .lang-selector { flex:1 1 100px; font-size:12px; height:30px; padding:2px 10px; }
        }
        .panel {
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 12px 14px 8px;
        }
        .panel:first-child { border-right:1px solid #eef0f5; }
        .dark .panel:first-child { border-color:#242b3f; }
        @media (max-width: 640px) {
            .panel:first-child { border-right:none; border-bottom:1px solid #eef0f5; }
            .dark .panel:first-child { border-color:#242b3f; }
        }
        .panel textarea {
            flex:1; min-height:120px; padding:2px 0 12px;
            border:none; outline:none; resize:none;
            font-size:18px; line-height:1.5;
            font-family:'Inter', sans-serif;
            background:transparent; color:inherit;
        }
        .panel textarea::placeholder { color:#9aa3b9; }
        .dark .panel textarea::placeholder { color:#4e5974; }
        .panel .output {
            flex:1; min-height:120px; padding:2px 0 12px;
            font-size:18px; line-height:1.5;
            white-space:pre-wrap; word-break:break-word;
            color:inherit;
        }
        .panel .output.placeholder { color:#9aa3b9; }
        .dark .panel .output.placeholder { color:#4e5974; }
        .panel .output.loading {
            color:#2563ff; font-weight:500; font-size:14px;
        }
        .panel-footer {
            display:flex; justify-content:space-between; align-items:center;
            padding-top:6px; border-top:1px solid #eef0f5;
            margin-top:2px; flex-wrap:wrap; gap:6px;
        }
        .dark .panel-footer { border-color:#242b3f; }
        .panel-actions { display:flex; gap:4px; align-items:center; }
        .icon-btn {
            width:32px; height:32px; border-radius:8px;
            border:1px solid #dce1e9; background:#ffffff;
            color:#4a5268; display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:0.2s;
        }
        .dark .icon-btn {
            background:#1a1f2e; border-color:#2c3346; color:#b0b8cc;
        }
        .icon-btn:hover { background:#f0f2f5; }
        .dark .icon-btn:hover { background:#262d42; }
        .icon-btn.active { color:#2563ff; border-color:#2563ff; }
        .icon-btn.copied {
            color:#22c55e; border-color:#22c55e; background:#f0fdf4;
        }
        .dark .icon-btn.copied { background:#0a1f14; }
        .icon-btn svg {
            width:16px; height:16px;
            stroke:currentColor; stroke-width:2; fill:none;
            stroke-linecap:round; stroke-linejoin:round;
        }
        .counter {
            font-size:11px; font-weight:600; padding:2px 10px;
            border-radius:40px; background:#f0f2f5; color:#6f788f;
        }
        .dark .counter { background:#1a1f2e; color:#8e97af; }
        .counter.warn { background:#fef3c7; color:#92400e; }
        .dark .counter.warn { background:#2a2410; color:#fbbf24; }
        .counter.over { background:#fee2e2; color:#991b1b; }
        .dark .counter.over { background:#2a1414; color:#f87171; }
        .lang-badge {
            font-size:10px; font-weight:700; padding:2px 10px;
            border-radius:40px; background:#eef2ff; color:#2563ff;
            border:1px solid #2563ff;
        }
        .dark .lang-badge { background:#141e3a; }

        /* Modal */
        .modal-overlay {
            position:fixed; inset:0; z-index:1000;
            display:flex; align-items:center; justify-content:center;
            padding:20px; background:rgba(0,0,0,0.3);
            backdrop-filter:blur(6px);
            animation:fadeIn 0.15s ease-out;
        }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal {
            background:#ffffff; border-radius:24px;
            max-width:440px; width:100%; max-height:80vh;
            display:flex; flex-direction:column; overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,0.15);
            animation:slideUp 0.15s ease-out;
        }
        .dark .modal { background:#131824; }
        @keyframes slideUp { from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;} }
        .modal-header {
            padding:14px 18px 10px; border-bottom:1px solid #eef0f5;
            display:flex; align-items:center; gap:10px;
        }
        .dark .modal-header { border-color:#242b3f; }
        .modal-header input {
            flex:1; padding:8px 14px; border-radius:40px;
            border:1px solid #dce1e9; font-size:14px;
            font-family:'Inter', sans-serif; background:#f5f7fa;
            color:#1e293b; outline:none; transition:0.2s;
        }
        .dark .modal-header input {
            background:#0e131f; border-color:#2c3346; color:#e8edf5;
        }
        .modal-header input:focus {
            border-color:#2563ff; box-shadow:0 0 0 3px rgba(37,99,255,0.12);
        }
        .modal-close {
            width:34px; height:34px; border-radius:10px;
            border:1px solid #dce1e9; background:transparent;
            color:#6f788f; display:flex; align-items:center; justify-content:center;
            cursor:pointer; transition:0.2s;
        }
        .dark .modal-close { border-color:#2c3346; color:#8e97af; }
        .modal-close:hover { background:#f0f2f5; }
        .dark .modal-close:hover { background:#1f263a; }
        .modal-close svg { width:18px; height:18px; stroke:currentColor; stroke-width:2; fill:none; }
        .tabs {
            display:flex; border-bottom:1px solid #eef0f5;
            padding:0 16px; gap:4px; flex-shrink:0;
        }
        .dark .tabs { border-color:#242b3f; }
        .tab-btn {
            padding:10px 14px 8px; border:none; background:transparent;
            font-family:'Inter', sans-serif; font-size:13px;
            font-weight:500; color:#6f788f; cursor:pointer;
            border-bottom:2px solid transparent; transition:0.2s;
        }
        .dark .tab-btn { color:#8e97af; }
        .tab-btn.active { color:#2563ff; border-bottom-color:#2563ff; }
        .tab-btn:hover { color:#1e293b; }
        .dark .tab-btn:hover { color:#e8edf5; }
        .modal-list {
            overflow-y:auto; padding:8px 12px 16px; flex:1;
        }
        .lang-item {
            display:flex; justify-content:space-between; align-items:center;
            padding:8px 12px; border-radius:10px; cursor:pointer;
            transition:0.15s; font-size:14px; border:1px solid transparent;
        }
        .lang-item:hover { background:#f0f2f5; border-color:#dce1e9; }
        .dark .lang-item:hover { background:#1a1f2e; border-color:#2c3346; }
        .lang-item .native { font-weight:500; }
        .lang-item .name { color:#6f788f; font-size:13px; margin-left:6px; }
        .dark .lang-item .name { color:#8e97af; }
        .lang-item .code {
            font-size:11px; font-weight:600; color:#6f788f;
            background:#f0f2f5; padding:2px 8px; border-radius:40px;
        }
        .dark .lang-item .code { background:#1a1f2e; color:#8e97af; }
        .lang-item.active { background:#eef2ff; border-color:#2563ff; }
        .dark .lang-item.active { background:#141e3a; border-color:#2563ff; }
        .lang-item.active .code { background:#2563ff; color:#fff; }
        .empty-message { text-align:center; color:#6f788f; font-size:14px; padding:30px 0; }
        .dark .empty-message { color:#8e97af; }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <!-- ====== ЗДЕСЬ ВСТАВЬТЕ СВОЙ ЛОГОТИП ====== -->
                <div class="logo-icon" id="https://maksimsuhomlinov37-hue.github.io/LumiTranslate/LumiTranslate-Favicon.png">L</div>
                <div class="logo-text">Lumi<span>Translate</span></div>
            </div>
            <button class="theme-btn" id="themeToggle" aria-label="Переключить тему">
                <!-- Иконка меняется автоматически: луна (светлая) / солнце (тёмная) -->
                <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
        </header>

        <div class="card">
            <div class="lang-bar">
                <div class="lang-selector" id="fromSelector" data-target="from">
                    <span id="fromLabel">Русский</span>
                    <span class="arrow"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
                </div>
                <button class="swap-btn" id="swapBtn">
                    <svg viewBox="0 0 24 24"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
                </button>
                <div class="lang-selector" id="toSelector" data-target="to">
                    <span id="toLabel">English</span>
                    <span class="arrow"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
                </div>
            </div>

            <div class="grid">
                <div class="panel">
                    <textarea id="inputText" placeholder="Введите текст для перевода…">Welcome to LumiTranslate</textarea>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-btn" id="voiceBtn" title="Голосовой ввод">
                                <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg>
                            </button>
                            <button class="icon-btn" id="speakInBtn" title="Озвучить">
                                <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
                            </button>
                            <button class="icon-btn" id="copyInBtn" title="Копировать">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/></svg>
                            </button>
                        </div>
                        <span class="counter" id="counter">0 / 5000</span>
                    </div>
                </div>
                <div class="panel">
                    <div class="output" id="outputText">Добро пожаловать в LumiTranslate</div>
                    <div class="panel-footer">
                        <div class="panel-actions">
                            <button class="icon-btn" id="speakOutBtn" title="Озвучить">
                                <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
                            </button>
                            <button class="icon-btn" id="copyOutBtn" title="Копировать">
                                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/></svg>
                            </button>
                        </div>
                        <span class="lang-badge" id="langBadge">EN</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <input type="text" id="searchInput" placeholder="Поиск языка…" />
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="tabs" id="tabsContainer">
                <button class="tab-btn active" data-tab="recent">Недавние</button>
                <button class="tab-btn" data-tab="popular">Популярные</button>
                <button class="tab-btn" data-tab="all">Все</button>
            </div>
            <div class="modal-list" id="modalList"></div>
        </div>
    </div>

    <script>
        // ============================================================
        //  LumiTranslate — финальная версия
        // ============================================================

        const LANGS = [
            { code: 'en', name: 'Английский', native: 'English' },
            { code: 'ru', name: 'Русский', native: 'Русский' },
            { code: 'kk', name: 'Казахский', native: 'Қазақша' },
            { code: 'tr', name: 'Турецкий', native: 'Türkçe' },
            { code: 'de', name: 'Немецкий', native: 'Deutsch' },
            { code: 'fr', name: 'Французский', native: 'Français' },
            { code: 'es', name: 'Испанский', native: 'Español' },
            { code: 'zh', name: 'Китайский', native: '中文' },
            { code: 'ar', name: 'Арабский', native: 'العربية' },
            { code: 'hi', name: 'Хинди', native: 'हिन्दी' },
            { code: 'ja', name: 'Японский', native: '日本語' },
            { code: 'ko', name: 'Корейский', native: '한국어' },
            { code: 'pt', name: 'Португальский', native: 'Português' },
            { code: 'it', name: 'Итальянский', native: 'Italiano' },
            { code: 'nl', name: 'Голландский', native: 'Nederlands' },
            { code: 'pl', name: 'Польский', native: 'Polski' },
            { code: 'uk', name: 'Украинский', native: 'Українська' },
            { code: 'uz', name: 'Узбекский', native: 'Oʻzbek' },
            { code: 'id', name: 'Индонезийский', native: 'Indonesia' },
            { code: 'ms', name: 'Малайский', native: 'Melayu' },
            { code: 'th', name: 'Тайский', native: 'ไทย' },
            { code: 'vi', name: 'Вьетнамский', native: 'Tiếng Việt' },
            { code: 'fa', name: 'Персидский', native: 'فارسی' },
            { code: 'ur', name: 'Урду', native: 'اردو' },
            { code: 'he', name: 'Иврит', native: 'עברית' },
            { code: 'el', name: 'Греческий', native: 'Ελληνικά' },
            { code: 'cs', name: 'Чешский', native: 'Čeština' },
            { code: 'sv', name: 'Шведский', native: 'Svenska' },
            { code: 'no', name: 'Норвежский', native: 'Norsk' },
            { code: 'da', name: 'Датский', native: 'Dansk' },
            { code: 'fi', name: 'Финский', native: 'Suomi' },
            { code: 'hu', name: 'Венгерский', native: 'Magyar' },
            { code: 'ro', name: 'Румынский', native: 'Română' },
            { code: 'bg', name: 'Болгарский', native: 'Български' },
            { code: 'sr', name: 'Сербский', native: 'Српски' },
            { code: 'hr', name: 'Хорватский', native: 'Hrvatski' },
            { code: 'sl', name: 'Словенский', native: 'Slovenščina' },
            { code: 'et', name: 'Эстонский', native: 'Eesti' },
            { code: 'lv', name: 'Латышский', native: 'Latviešu' },
            { code: 'lt', name: 'Литовский', native: 'Lietuvių' },
            { code: 'af', name: 'Африкаанс', native: 'Afrikaans' },
            { code: 'sw', name: 'Суахили', native: 'Kiswahili' },
            { code: 'ta', name: 'Тамильский', native: 'தமிழ்' },
            { code: 'te', name: 'Телугу', native: 'తెలుగు' },
            { code: 'ml', name: 'Малаялам', native: 'മലയാളം' },
            { code: 'kn', name: 'Каннада', native: 'ಕನ್ನಡ' },
            { code: 'gu', name: 'Гуджарати', native: 'ગુજરાતી' },
            { code: 'mr', name: 'Маратхи', native: 'मराठी' },
            { code: 'pa', name: 'Панджаби', native: 'ਪੰਜਾਬੀ' },
            { code: 'bn', name: 'Бенгальский', native: 'বাংলা' },
            { code: 'my', name: 'Мьянманский', native: 'မြန်မာ' },
            { code: 'km', name: 'Кхмерский', native: 'ខ្មែរ' },
            { code: 'lo', name: 'Лаосский', native: 'ລາວ' },
            { code: 'mn', name: 'Монгольский', native: 'Монгол' },
            { code: 'ne', name: 'Непальский', native: 'नेपाली' },
            { code: 'si', name: 'Сингальский', native: 'සිංහල' },
        ];

        const POPULAR_CODES = ['en', 'ru', 'kk', 'tr', 'zh'];

        // DOM
        const fromSelector = document.getElementById('fromSelector');
        const toSelector = document.getElementById('toSelector');
        const fromLabel = document.getElementById('fromLabel');
        const toLabel = document.getElementById('toLabel');
        const swapBtn = document.getElementById('swapBtn');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const counter = document.getElementById('counter');
        const langBadge = document.getElementById('langBadge');
        const voiceBtn = document.getElementById('voiceBtn');
        const speakInBtn = document.getElementById('speakInBtn');
        const speakOutBtn = document.getElementById('speakOutBtn');
        const copyInBtn = document.getElementById('copyInBtn');
        const copyOutBtn = document.getElementById('copyOutBtn');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const logoIcon = document.getElementById('logoIcon');

        const modalOverlay = document.getElementById('modalOverlay');
        const searchInput = document.getElementById('searchInput');
        const modalList = document.getElementById('modalList');
        const modalClose = document.getElementById('modalClose');
        const tabsContainer = document.getElementById('tabsContainer');

        // State
        let currentFrom = 'ru';
        let currentTo = 'en';
        let currentOutput = '';
        let translateTimer = null;
        let recentLangs = JSON.parse(localStorage.getItem('recentLangs') || '[]');
        if (recentLangs.length > 5) recentLangs = recentLangs.slice(0, 5);
        let activeTarget = 'from';

        function getLangByCode(code) {
            return LANGS.find(l => l.code === code) || { code, name: code, native: code };
        }

        function updateLabels() {
            const fromLang = getLangByCode(currentFrom);
            const toLang = getLangByCode(currentTo);
            fromLabel.textContent = fromLang.native;
            toLabel.textContent = toLang.native;
            langBadge.textContent = currentTo.toUpperCase();
        }

        function saveRecent(code) {
            recentLangs = recentLangs.filter(c => c !== code);
            recentLangs.unshift(code);
            if (recentLangs.length > 5) recentLangs = recentLangs.slice(0, 5);
            localStorage.setItem('recentLangs', JSON.stringify(recentLangs));
        }

        // Translation
        async function translateText(text, sl, tl) {
            if (!text.trim()) return '';
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data && data[0]) {
                    return data[0].map(item => item[0]).join('');
                }
            } catch (e) {
                console.warn('Google Translate error, trying MyMemory...');
            }
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {}
            throw new Error('Перевод недоступен');
        }

        async function performTranslation() {
            const text = inputText.value;
            const sl = currentFrom;
            const tl = currentTo;
            if (!text.trim()) {
                outputText.textContent = '';
                outputText.classList.remove('loading', 'placeholder');
                return;
            }
            outputText.textContent = 'Переводим…';
            outputText.classList.add('loading');
            outputText.classList.remove('placeholder');
            try {
                const result = await translateText(text, sl, tl);
                currentOutput = result;
                outputText.textContent = result;
                outputText.classList.remove('loading');
            } catch (e) {
                outputText.textContent = 'Ошибка: ' + e.message;
                outputText.classList.remove('loading');
                outputText.classList.add('placeholder');
            }
        }

        function scheduleTranslation() {
            if (translateTimer) clearTimeout(translateTimer);
            translateTimer = setTimeout(performTranslation, 400);
        }

        function setLanguage(target, code) {
            if (target === 'from') {
                currentFrom = code;
                saveRecent(code);
            } else {
                currentTo = code;
                saveRecent(code);
            }
            updateLabels();
            scheduleTranslation();
            if (target === 'to') langBadge.textContent = currentTo.toUpperCase();
        }

        // Modal
        function openModal(target) {
            activeTarget = target;
            modalOverlay.style.display = 'flex';
            searchInput.value = '';
            renderTab('recent');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.tab-btn[data-tab="recent"]').classList.add('active');
            searchInput.focus();
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        function renderTab(tab) {
            const search = searchInput.value.toLowerCase().trim();
            let list = [];
            if (tab === 'recent') {
                if (recentLangs.length === 0) {
                    modalList.innerHTML = `<div class="empty-message">Вы ещё не выбирали языки</div>`;
                    return;
                }
                list = recentLangs.map(code => getLangByCode(code));
            } else if (tab === 'popular') {
                list = POPULAR_CODES.map(code => getLangByCode(code));
            } else {
                list = LANGS;
            }
            if (search) {
                list = list.filter(l =>
                    l.name.toLowerCase().includes(search) ||
                    l.native.toLowerCase().includes(search) ||
                    l.code.includes(search)
                );
            }
            if (list.length === 0) {
                modalList.innerHTML = `<div class="empty-message">Языков не найдено</div>`;
                return;
            }
            const seen = new Set();
            list = list.filter(l => {
                if (seen.has(l.code)) return false;
                seen.add(l.code);
                return true;
            });
            const currentCode = activeTarget === 'from' ? currentFrom : currentTo;
            let html = '';
            list.forEach(l => {
                const active = l.code === currentCode ? 'active' : '';
                html += `
                    <div class="lang-item ${active}" data-code="${l.code}">
                        <span><span class="native">${l.native}</span> <span class="name">• ${l.name}</span></span>
                        <span class="code">${l.code.toUpperCase()}</span>
                    </div>
                `;
            });
            modalList.innerHTML = html;
            document.querySelectorAll('.lang-item').forEach(item => {
                item.addEventListener('click', () => {
                    const code = item.dataset.code;
                    setLanguage(activeTarget, code);
                    closeModal();
                });
            });
        }

        fromSelector.addEventListener('click', () => openModal('from'));
        toSelector.addEventListener('click', () => openModal('to'));
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        tabsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTab(btn.dataset.tab);
        });
        searchInput.addEventListener('input', () => {
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab) renderTab(activeTab.dataset.tab);
        });

        // Swap
        swapBtn.addEventListener('click', () => {
            const temp = currentFrom;
            currentFrom = currentTo;
            currentTo = temp;
            updateLabels();
            saveRecent(currentFrom);
            saveRecent(currentTo);
            const tempText = inputText.value;
            inputText.value = currentOutput;
            outputText.textContent = '';
            currentOutput = '';
            scheduleTranslation();
            langBadge.textContent = currentTo.toUpperCase();
        });

        // Voice
        voiceBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Голосовой ввод поддерживается только в Chrome.');
                return;
            }
            if (voiceBtn.classList.contains('active')) {
                if (window.recognition) window.recognition.stop();
                voiceBtn.classList.remove('active');
                return;
            }
            const rec = new SpeechRecognition();
            rec.lang = currentFrom;
            rec.continuous = false;
            rec.interimResults = false;
            rec.onstart = () => voiceBtn.classList.add('active');
            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                inputText.value += ' ' + transcript;
                inputText.dispatchEvent(new Event('input'));
            };
            rec.onerror = () => voiceBtn.classList.remove('active');
            rec.onend = () => voiceBtn.classList.remove('active');
            window.recognition = rec;
            rec.start();
        });

        // Speak
        function speak(text, lang) {
            if (!text) return;
            if (window.speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                speechSynthesis.speak(utterance);
            }
        }
        speakInBtn.addEventListener('click', () => speak(inputText.value, currentFrom));
        speakOutBtn.addEventListener('click', () => speak(currentOutput || outputText.textContent, currentTo));

        // Copy
        function copy(text, btn) {
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.classList.add('copied');
                    setTimeout(() => btn.classList.remove('copied'), 1500);
                }).catch(() => fallbackCopy(text, btn));
            } else {
                fallbackCopy(text, btn);
            }
        }
        function fallbackCopy(text, btn) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 1500);
            } catch (e) {}
            document.body.removeChild(ta);
        }
        copyInBtn.addEventListener('click', () => copy(inputText.value, copyInBtn));
        copyOutBtn.addEventListener('click', () => copy(currentOutput || outputText.textContent, copyOutBtn));

        // Counter
        inputText.addEventListener('input', () => {
            const len = inputText.value.length;
            counter.textContent = len + ' / 5000';
            if (len > 4800) {
                counter.classList.add('warn');
                if (len >= 5000) counter.classList.add('over');
            } else {
                counter.classList.remove('warn', 'over');
            }
            scheduleTranslation();
        });

        // ========== ТЕМА С УЛУЧШЕННЫМИ ИКОНКАМИ ==========
        let isDark = localStorage.getItem('theme') === 'dark';
        const sunIcon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>`;
        const moonIcon = `<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

        function setTheme(dark) {
            isDark = dark;
            document.body.classList.toggle('dark', dark);
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            themeIcon.innerHTML = dark ? sunIcon : moonIcon;
        }

        // Инициализация темы
        setTheme(isDark);

        themeToggle.addEventListener('click', () => {
            setTheme(!isDark);
        });

        // Init
        if (recentLangs.length >= 2) {
            currentFrom = recentLangs[0];
            currentTo = recentLangs[1];
        } else if (recentLangs.length === 1) {
            currentFrom = recentLangs[0];
        }
        if (!LANGS.find(l => l.code === currentFrom)) currentFrom = 'ru';
        if (!LANGS.find(l => l.code === currentTo)) currentTo = 'en';
        updateLabels();
        langBadge.textContent = currentTo.toUpperCase();
        setTimeout(performTranslation, 300);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        console.log('LumiTranslate загружен. Иконки солнца/луны обновлены.');
    </script>
</body>
</html>
