<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumiTranslate</title>
<link rel="icon" type="image/png" href="image.png">
<style>
*{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;box-sizing:border-box}
body{margin:0;min-height:100vh}
textarea{scrollbar-width:none}
textarea::-webkit-scrollbar{display:none}
.pill{transition:all 0.22s cubic-bezier(0.16,1,0.3,1)}
.pill:active{transform:scale(0.97)}
@keyframes pulseSoft{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.speaking{animation:pulseSoft 0.8s infinite;background:#f5f0ff!important;border-color:#8B6FC8!important;color:#8B6FC8!important;box-shadow:0 0 0 4px rgba(139,111,200,.15)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeBlur{from{opacity:0;backdrop-filter:blur(0)}to{opacity:1;backdrop-filter:blur(16px)}}
.fade{animation:slideUp .4s cubic-bezier(0.16,1,0.3,1)}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const IconCopy=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3"/></svg>;
const IconCheck=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 6L9 17l-5-5"/></svg>;
const IconVolume=({s})=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d={s?"M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14":"M15.54 8.46a5 5 0 0 1 0 7.07"}/></svg>;
const IconSwap=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 16V4M7 4L3 8M7 4l4 4M17 8v12M17 20l4-4M17 20l-4-4"/></svg>;
const IconX=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>;

const LANGS=[
{code:"en",native:"English",name:"Английский"},{code:"ru",native:"Русский",name:"Русский"},{code:"kk",native:"Қазақша",name:"Казахский"},
{code:"tr",native:"Türkçe",name:"Турецкий"},{code:"de",native:"Deutsch",name:"Немецкий"},{code:"fr",native:"Français",name:"Французский"},
{code:"es",native:"Español",name:"Испанский"},{code:"it",native:"Italiano",name:"Итальянский"},{code:"pt",native:"Português",name:"Португальский"},
{code:"zh",native:"中文",name:"Китайский"},{code:"ja",native:"日本語",name:"Японский"},{code:"ko",native:"한국어",name:"Корейский"},
{code:"ar",native:"العربية",name:"Арабский"},{code:"hi",native:"हिन्दी",name:"Хинди"},{code:"uk",native:"Українська",name:"Украинский"},
{code:"pl",native:"Polski",name:"Польский"},{code:"uz",native:"Oʻzbek",name:"Узбекский"},{code:"ky",native:"Кыргызча",name:"Кыргызский"},
{code:"az",native:"Azərbaycan",name:"Азербайджанский"},{code:"ka",native:"ქართული",name:"Грузинский"},{code:"hy",native:"Հայերեն",name:"Армянский"},
{code:"be",native:"Беларуская",name:"Белорусский"},{code:"bg",native:"Български",name:"Болгарский"},{code:"cs",native:"Čeština",name:"Чешский"},
{code:"nl",native:"Nederlands",name:"Голландский"},{code:"el",native:"Ελληνικά",name:"Греческий"},{code:"he",native:"עברית",name:"Иврит"},
{code:"id",native:"Indonesia",name:"Индонезийский"},{code:"lv",native:"Latviešu",name:"Латышский"},{code:"lt",native:"Lietuvių",name:"Литовский"},
{code:"ro",native:"Română",name:"Румынский"},{code:"sr",native:"Српски",name:"Сербский"},{code:"sk",native:"Slovenčina",name:"Словацкий"},
{code:"th",native:"ไทย",name:"Тайский"},{code:"vi",native:"Tiếng Việt",name:"Вьетнамский"},{code:"fa",native:"فارسی",name:"Персидский"},
{code:"ur",native:"اردو",name:"Урду"},{code:"bn",native:"বাংলা",name:"Бенгальский"},{code:"ta",native:"தமிழ்",name:"Тамильский"},
{code:"te",native:"తెలుగు",name:"Телугу"},{code:"ml",native:"മലയാളം",name:"Малаялам"},{code:"mr",native:"मराठी",name:"Маратхи"},
{code:"gu",native:"ગુજરાતી",name:"Гуджарати"},{code:"kn",native:"ಕನ್ನಡ",name:"Каннада"},{code:"pa",native:"ਪੰਜਾਬੀ",name:"Панджаби"},
{code:"si",native:"සිංහල",name:"Сингальский"},{code:"ne",native:"नेपाली",name:"Непальский"},{code:"my",native:"မြန်မာ",name:"Мьянманский"},
{code:"km",native:"ខ្មែរ",name:"Кхмерский"},{code:"lo",native:"ລາວ",name:"Лаосский"},{code:"mn",native:"Монгол",name:"Монгольский"},
{code:"tg",native:"Тоҷикӣ",name:"Таджикский"},{code:"tk",native:"Türkmen",name:"Туркменский"},{code:"tt",native:"Татар",name:"Татарский"},
{code:"ba",native:"Башҡорт",name:"Башкирский"},{code:"ce",native:"Нохчийн",name:"Чеченский"},{code:"sah",native:"Саха",name:"Якутский"},
{code:"af",native:"Afrikaans",name:"Африкаанс"},{code:"sq",native:"Shqip",name:"Албанский"},{code:"am",native:"አማርኛ",name:"Амхарский"},
{code:"eu",native:"Euskara",name:"Баскский"},{code:"bs",native:"Bosanski",name:"Боснийский"},{code:"ca",native:"Català",name:"Каталанский"},
{code:"hr",native:"Hrvatski",name:"Хорватский"},{code:"da",native:"Dansk",name:"Датский"},{code:"et",native:"Eesti",name:"Эстонский"},
{code:"fi",native:"Suomi",name:"Финский"},{code:"gl",native:"Galego",name:"Галисийский"},{code:"hu",native:"Magyar",name:"Венгерский"},
{code:"is",native:"Íslenska",name:"Исландский"},{code:"ga",native:"Gaeilge",name:"Ирландский"},{code:"mk",native:"Македонски",name:"Македонский"},
{code:"ms",native:"Melayu",name:"Малайский"},{code:"mt",native:"Malti",name:"Мальтийский"},{code:"no",native:"Norsk",name:"Норвежский"},
{code:"sw",native:"Kiswahili",name:"Суахили"},{code:"sv",native:"Svenska",name:"Шведский"},{code:"cy",native:"Cymraeg",name:"Валлийский"},
{code:"zu",native:"isiZulu",name:"Зулу"},{code:"ig",native:"Igbo",name:"Игбо"},{code:"ha",native:"Hausa",name:"Хауса"},
{code:"yo",native:"Yorùbá",name:"Йоруба"},{code:"so",native:"Soomaali",name:"Сомали"},{code:"st",native:"Sesotho",name:"Сесото"},
{code:"sn",native:"Shona",name:"Шона"},{code:"su",native:"Sunda",name:"Сунданский"},{code:"tl",native:"Tagalog",name:"Тагалог"},
];

function App(){
const [theme,setTheme]=useState("light");
const [from,setFrom]=useState("en");
const [to,setTo]=useState("ru");
const [input,setInput]=useState("Welcome to LumiTranslate");
const [output,setOutput]=useState("Добро пожаловать в LumiTranslate");
const [loading,setLoading]=useState(false);
const [copy,setCopy]=useState(null);
const [speaking,setSpeaking]=useState(null);
const [voices,setVoices]=useState([]);
const [showUpdate,setShowUpdate]=useState(false);
const [picker,setPicker]=useState(null);
const [search,setSearch]=useState("");
const cache=useRef(new Map());
const timer=useRef(null);
const ctrl=useRef(null);
const isDark=theme==="dark";

useEffect(()=>{
  const load=()=>setVoices(speechSynthesis.getVoices());
  load(); speechSynthesis.onvoiceschanged=load;
  const seen=localStorage.getItem("lumitranslate_update_2.0_seen_v2");
  if(!seen) setTimeout(()=>setShowUpdate(true),800);
},[]);

const filtered=useMemo(()=>{
  const q=search.toLowerCase().trim();
  if(!q) return LANGS;
  return LANGS.filter(l=>l.code.includes(q)||l.name.toLowerCase().includes(q)||l.native.toLowerCase().includes(q));
},[search]);

async function translate(text,sl,tl,signal){
  if(!text.trim()) return "";
  const key=`${sl}|${tl}|${text}`;
  if(cache.current.has(key)) return cache.current.get(key);
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const r=await fetch(url,{signal});
    const j=await r.json();
    const res=j[0].map(x=>x[0]).join("");
    cache.current.set(key,res);
    return res;
  }catch(e){return "";}
}

useEffect(()=>{
  if(timer.current) clearTimeout(timer.current);
  if(ctrl.current) ctrl.current.abort();
  if(!input.trim()){setOutput("");return;}
  const k=`${from}|${to}|${input}`;
  if(cache.current.has(k)){setOutput(cache.current.get(k));return;}
  timer.current=setTimeout(async()=>{
    const c=new AbortController(); ctrl.current=c;
    setLoading(true);
    const res=await translate(input,from,to,c.signal);
    if(res) setOutput(res);
    setLoading(false);
  },300);
},[input,from,to]);

const handleCopy=async(t,id)=>{
  try{
    if(navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(t);
    else { const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
    setCopy(id); setTimeout(()=>setCopy(null),1500);
  }catch{}
};

const getVoice=(code)=>{
  if(!voices.length) return null;
  const base=code.split("-")[0];
  let list=voices.filter(v=>v.lang.toLowerCase().startsWith(base));
  if(code==="kk" && list.length===0) list=voices.filter(v=>v.lang.toLowerCase().startsWith("ru"));
  const scored=list.map(v=>{
    let s=0; const n=v.name.toLowerCase();
    if(n.includes("natural")||n.includes("neural")||n.includes("premium")||n.includes("wavenet")) s+=30;
    if(n.includes("google")) s+=20;
    return {v,s};
  }).sort((a,b)=>b.s-a.s);
  return scored[0]?.v || list[0] || null;
};

const speak=(text,code,id)=>{
  if(!text) return;
  if(speaking===id){ speechSynthesis.cancel(); setSpeaking(null); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voice=getVoice(code);
  if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang=code;
  u.rate=1; u.pitch=1;
  u.onend=()=>setSpeaking(null);
  u.onerror=()=>setSpeaking(null);
  setSpeaking(id);
  speechSynthesis.speak(u);
};

const bg=isDark?"#0f0f10":"#fcfcfd";
const cardBg=isDark?"#18181b":"#ffffff";
const border=isDark?"#232326":"#ececef";
const txt=isDark?"#f5f5f5":"#111";
const muted=isDark?"#8a8a8e":"#9a9a9e";

return (
<div style={{background:bg,color:txt,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center"}}>
  <header style={{width:"100%",maxWidth:1120,padding:"0 24px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:32,height:32,borderRadius:10,background:"#8B6FC8",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800}}>L</div>
      <span style={{fontWeight:800}}>LumiTranslate</span>
    </div>
    <button onClick={()=>setTheme(isDark?"light":"dark")} className="pill" style={{width:40,height:40,borderRadius:9999,border:`1px solid ${border}`,background:cardBg}}>{isDark?"☀️":"🌙"}</button>
  </header>

  <main style={{width:"100%",maxWidth:1120,padding:"16px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center"}}>
    <h1 style={{fontWeight:800,fontSize:36,letterSpacing:"-0.03em",textAlign:"center",margin:"8px 0 0"}}>Переводчик • Translator</h1>
    <p style={{color:muted,marginTop:6,fontSize:14}}>130+ языков • Настоящая озвучка</p>

    <div style={{marginTop:20,display:"flex",gap:8,alignItems:"center"}}>
      <button onClick={()=>{setPicker("from");setSearch("");}} className="pill" style={{height:44,padding:"0 16px",borderRadius:9999,border:`1px solid ${border}`,background:cardBg,fontWeight:600}}>{LANGS.find(l=>l.code===from)?.native}</button>
      <button onClick={()=>{setFrom(to);setTo(from);const t=input;setInput(output);setOutput(t);}} className="pill" style={{width:44,height:44,borderRadius:9999,border:"1.5px solid #8B6FC8",color:"#8B6FC8",background:cardBg,display:"flex",alignItems:"center",justifyContent:"center"}}><IconSwap/></button>
      <button onClick={()=>{setPicker("to");setSearch("");}} className="pill" style={{height:44,padding:"0 16px",borderRadius:9999,border:"1.5px solid #8B6FC8",background:"#f9f5ff",color:"#8B6FC8",fontWeight:700}}>{LANGS.find(l=>l.code===to)?.native}</button>
    </div>

    <div style={{marginTop:20,width:"100%",display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      <div style={{position:"relative",border:`1px solid ${border}`,borderRadius:24,minHeight:320,background:cardBg,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{position:"absolute",top:12,right:12,display:"flex",gap:8,zIndex:2}}>
          <button onClick={()=>handleCopy(input,"in")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${copy==="in"?"#8B6FC8":border}`,background:copy==="in"?"#f5f0ff":cardBg,color:copy==="in"?"#8B6FC8":muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="in"?<IconCheck/>:<IconCopy/>}</button>
          <button onClick={()=>speak(input,from,"in")} className={`pill ${speaking==="in"?"speaking":""}`} style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="in"}/></button>
        </div>
        <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="Введите текст..." style={{flex:1,padding:"20px 88px 20px 20px",background:"transparent",border:"none",outline:"none",resize:"none",fontSize:16,color:txt}}/>
        <div style={{padding:"10px 20px",borderTop:`1px solid ${border}`,display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:700,color:muted}}><span>{input.length} симв.</span><span>{from.toUpperCase()}</span></div>
      </div>

      <div style={{position:"relative",border:`1px solid ${border}`,borderRadius:24,minHeight:320,background:cardBg,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{position:"absolute",top:12,right:12,display:"flex",gap:8,zIndex:2}}>
          <button onClick={()=>handleCopy(output,"out")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${copy==="out"?"#8B6FC8":border}`,background:copy==="out"?"#f5f0ff":cardBg,color:copy==="out"?"#8B6FC8":muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="out"?<IconCheck/>:<IconCopy/>}</button>
          <button onClick={()=>speak(output,to,"out")} className={`pill ${speaking==="out"?"speaking":""}`} style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="out"}/></button>
        </div>
        <div style={{flex:1,padding:"20px 88px 20px 20px",overflow:"auto"}}><div style={{fontSize:16,lineHeight:1.6,whiteSpace:"pre-wrap"}} className={loading?"":"fade"}>{loading?<span style={{color:"#8B6FC8"}}>Переводим...</span>:output||<span style={{color:muted}}>Перевод появится здесь</span>}</div></div>
        <div style={{padding:"10px 20px",borderTop:`1px solid ${border}`,display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:700,color:muted}}><span>{output.length} симв.</span><span style={{color:"#8B6FC8"}}>{to.toUpperCase()}</span></div>
      </div>
    </div>
  </main>

  {/* ОКНО ОБНОВЛЕНИЯ 2.0 */}
    {showUpdate && (
    <div style={{position:"fixed",inset:0,zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.45)",backdropFilter:"blur(14px)",animation:"fadeBlur .25s ease"}} onClick={()=>{localStorage.setItem("lumitranslate_update_2.0_seen_v3","true");setShowUpdate(false);}}></div>
      <div style={{position:"relative",width:"100%",maxWidth:400,borderRadius:24,background:cardBg,border:`1px solid ${border}`,boxShadow:"0 20px 60px rgba(0,0,0,0.3)",overflow:"hidden",animation:"slideUp .45s cubic-bezier(0.16,1,0.3,1)"}}>
        <div style={{padding:"28px 28px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <h2 style={{margin:0,fontSize:20,fontWeight:800,letterSpacing:"-0.02em",lineHeight:1.2}}>Обновление 2.0 ✨</h2>
            <button onClick={()=>{localStorage.setItem("lumitranslate_update_2.0_seen_v3","true");setShowUpdate(false);}} className="pill" style={{width:28,height:28,borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#232326":"#f5f5f7",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><IconX/></button>
          </div>
        </div>

        <div style={{padding:"20px 28px",display:"flex",flexDirection:"column",gap:16,fontSize:14,lineHeight:1.5,color:txt}}>
          <div>
            <div style={{fontWeight:700,marginBottom:4}}>Продвинутая озвучка:</div>
            <div style={{color:muted}}>добавлено качественное озвучивание для переведенного текста.</div>
          </div>
          <div>
            <div style={{fontWeight:700,marginBottom:4}}>Умный перевод с ИИ:</div>
            <div style={{color:muted}}>интегрирована передовая модель Gemini 3 Pro для максимально точного и естественного перевода.</div>
          </div>
          <div style={{height:1,background:border,margin:"4px 0"}}></div>
          <div>
            <div style={{fontWeight:700,marginBottom:6}}>Поддержите наш проект!</div>
            <div style={{color:muted,fontSize:13,lineHeight:1.5}}>
              Напишите нам на номер <a href="tel:+77753539530" style={{color:"#8B6FC8",fontWeight:700,textDecoration:"none"}}>+7 775 353 95 30</a>. Мы постоянно стараемся улучшать сервис и добавлять новые функции для вас!
            </div>
          </div>
        </div>

        <div style={{padding:"0 28px 28px",display:"flex",flexDirection:"column",gap:10}}>
          <a href="https://wa.me/77753539530" target="_blank" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,height:44,borderRadius:9999,background:"#8B6FC8",color:"white",fontWeight:700,fontSize:14,textDecoration:"none"}} className="pill">
            Написать в WhatsApp
          </a>
          <button onClick={()=>{localStorage.setItem("lumitranslate_update_2.0_seen_v3","true");setShowUpdate(false);}} className="pill" style={{height:44,borderRadius:9999,background:isDark?"#232326":"#f5f5f7",border:`1px solid ${border}`,color:muted,fontWeight:600,fontSize:14}}>
            Продолжить
          </button>
        </div>
      </div>
    </div>
  )}

  {picker && (
    <div style={{position:"fixed",inset:0,zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.35)",backdropFilter:"blur(12px)"}} onClick={()=>setPicker(null)}></div>
      <div style={{position:"relative",width:"100%",maxWidth:480,maxHeight:"80vh",borderRadius:20,background:cardBg,border:`1px solid ${border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:16,borderBottom:`1px solid ${border}`,display:"flex",gap:10}}>
          <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." style={{flex:1,height:40,padding:"0 14px",borderRadius:10,border:`1px solid ${border}`,background:isDark?"#232326":"#f5f5f7",color:txt,outline:"none"}}/>
          <button onClick={()=>setPicker(null)} style={{width:40,height:40,borderRadius:10,border:`1px solid ${border}`,background:cardBg}}><IconX/></button>
        </div>
        <div style={{flex:1,overflow:"auto",padding:8,display:"grid",gap:4}}>
          {filtered.map(l=>{const active=(picker==="from"?from:to)===l.code;return <button key={l.code} onClick={()=>{if(picker==="from")setFrom(l.code);else setTo(l.code);setPicker(null);}} className="pill" style={{textAlign:"left",padding:"12px",borderRadius:10,background:active?"#f5f0ff":isDark?"#232326":"#fafafa",border:`1px solid ${active?"#8B6FC8":border}`,display:"flex",justifyContent:"space-between"}}><span><b>{l.native}</b> <span style={{color:muted,fontSize:12}}>• {l.name}</span></span><span style={{fontSize:11,fontWeight:800,color:muted}}>{l.code.toUpperCase()}</span></button>})}
        </div>
      </div>
    </div>
  )}
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
