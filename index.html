*{font-family:Inter,sans-serif;box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f5f7fb;color:#1d2330}
.dark body{background:#0c0e12;color:#e8eaf0}
textarea::-webkit-scrollbar{display:none}
.pill{transition:.2s;cursor:pointer} .pill:active{transform:scale(.97)}
.tab{position:relative;white-space:nowrap;transition:.2s}
.tab.active{color:#2563ff;font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:0;left:10px;right:10px;height:2.5px;background:#2563ff;border-radius:2px}
.word-wrap{position:relative;display:inline-block;margin:0 2px 22px 2px;line-height:1.2}
.word-wrap .suggest{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#2563ff;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9999px;white-space:nowrap;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,255,.35);animation:pop .2s}
.word-wrap .typo{border-bottom:2px wavy #ff3b30;padding-bottom:1px}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.suggestion-bar{padding:10px 16px;min-height:48px;background:#fff9f9;border-bottom:1px solid #ffe1e1;display:flex;flex-wrap:wrap;gap:2px;align-items:flex-start;font-size:16px;line-height:1.6}
.dark .suggestion-bar{background:#1e1212;border-color:#3a2222}
.counter{font-size:11px;font-weight:700;padding:4px 8px;border-radius:9999px}
.counter.ok{background:#eef1f6;color:#7a8191}
.counter.warn{background:#fff3cd;color:#856404}
.counter.over{background:#f8d7da;color:#721c24}
.dark .counter.ok{background:#212531;color:#8b93a3}
</style>

function levenshtein(a,b){
  const m=a.length,n=b.length; const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
const TYPO_MAP={
en:{"mame":"name","nmae":"name","naem":"name","nane":"name","neme":"name","helo":"hello","helllo":"hello","teh":"the","becasue":"because","yuor":"your","yoru":"your","recieve":"receive","isnt":"isn't","dont":"don't","im":"I'm","id":"I'd","welcom":"welcome","lumi":"Lumi","translat":"Translate"},
ru:{"привт":"привет","спс":"спасибо","пж":"пожалуйста","пжл":"пожалуйста","щас":"сейчас","счас":"сейчас","што":"что","канешна":"конечно","извени":"извини","здрасти":"здравствуйте","какдила":"как дела","этj":"это","этоj":"это","етот":"этот","ета":"это","зравствуйте":"здравствуйте"}
};

function correctWord(raw){
  const m=raw.match(/^([^a-zA-Zа-яА-ЯёЁ0-9]*)([a-zA-Zа-яА-ЯёЁ0-9]+)([^a-zA-Zа-яА-ЯёЁ0-9]*)$/);
  if(!m) return {orig:raw, fixed:raw, isTypo:false};
  const [,pre,core,suf]=m;
  const low=core.toLowerCase();
  let fixedCore=null;
  if(TYPO_MAP.en[low]) fixedCore=TYPO_MAP.en[low];
  else if(TYPO_MAP.ru[low]) fixedCore=TYPO_MAP.ru[low];
  else if(low.length>=3 && low.length<=6){
    if(levenshtein(low,"name")===1) fixedCore="name";
    if(levenshtein(low,"это")===1 && /[а-я]/i.test(low)) fixedCore="это";
  }
  if(fixedCore && fixedCore.toLowerCase()!==low){
    if(core[0]===core[0].toUpperCase()) fixedCore=fixedCore[0].toUpperCase()+fixedCore.slice(1);
    return {orig:raw, fixed:pre+fixedCore+suf, isTypo:true, suggestion:fixedCore};
  }
  return {orig:raw, fixed:raw, isTypo:false};
}

function smartFix(text){
  let s=text;
  s=s.replace(/\bmy\s+mame\s+is\b/gi,"my name is").replace(/\bmy\s+mane\s+is\b/gi,"my name is");
  s=s.replace(/этj/gi,"это");
  s=s.split(/(\s+)/).map(t=>{
    if(/^\s+$/.test(t)) return t;
    const c=correctWord(t);
    return c.fixed;
  }).join("");
  return s.trim();
}

function postProcess(src,tgt,sl,tl){
  let out=tgt;
  if(!out) return out;
  // Welcome to LumiTranslate - идеальный перевод
  if(/welcome\s+to\s+lumitranslate/i.test(src)){
    if(tl==="ru") return "Добро пожаловать в LumiTranslate";
    if(tl==="kk") return "LumiTranslate-ке қош келдіңіз";
    if(tl==="tr") return "LumiTranslate'e hoş geldiniz";
    if(tl==="en") return "Welcome to LumiTranslate";
  }
  if(sl==="en" && tl==="ru"){
    if(/my\s+name\s+is/i.test(src)){
      const nameMatch=src.match(/my\s+name\s+is\s+(.+)$/i);
      const name=nameMatch? nameMatch[1].trim() : "";
      if(/моя\s+мама/i.test(out)){
        out=name? `Привет, меня зовут ${name}` : "Привет, меня зовут";
      }
      if(/^мое имя/i.test(out) && name){
        out=out.replace(/^мое имя\s+/i,"Меня зовут ");
      }
    }
    out=out.replace(/\s+([.,!?])/g,"$1");
  }
  return out;
}
async function googleTranslate(text,sl,tl){
  const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&dt=bd&dt=at&q=${encodeURIComponent(text)}`;
  const r=await fetch(url); const j=await r.json();
  return j[0].map(x=>x[0]).join("");
}
async function myMemoryTranslate(text,sl,tl){
  try{
    const url=`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
    const r=await fetch(url); const j=await r.json();
    if(j.responseData && j.responseData.translatedText) return j.responseData.translatedText;
  }catch{} return "";
}

function App(){
const [theme,setTheme]=useState("light");
const [from,setFrom]=useState("en");
const [to,setTo]=useState("ru");
const [input,setInput]=useState("Welcome to LumiTranslate");
const [output,setOutput]=useState("Добро пожаловать в LumiTranslate");
const [loading,setLoading]=useState(false);
const [copy,setCopy]=useState(null);
const [speaking,setSpeaking]=useState(null);
const [picker,setPicker]=useState(null);
const [search,setSearch]=useState("");
const cache=useRef(new Map());
const timer=useRef(null);
const isDark=theme==="dark";

const filtered=useMemo(()=>{
  const q=search.toLowerCase().trim(); if(!q) return LANGS;
  return LANGS.filter(l=>l.code.toLowerCase().includes(q)||l.name.toLowerCase().includes(q)||l.native.toLowerCase().includes(q));
},[search]);

const tokens=useMemo(()=>{
  if(!input) return [];
  return input.split(/(\s+)/).map((t,i)=>{
    if(/^\s+$/.test(t)) return {text:t,isSpace:true,idx:i};
    const corr=correctWord(t);
    return {text:t,isSpace:false,idx:i,corr};
  });
},[input]);

async function translate(text,sl,tl){
  if(!text.trim()) return "";
  const fixed=smartFix(text);
  const key=`${sl}|${tl}|${fixed}`; if(cache.current.has(key)) return cache.current.get(key);
  let res="";
  try{ res=await googleTranslate(fixed,sl,tl); }catch{ res=""; }
  const bad=!res || (sl==="en" && tl==="ru" && /моя\s+мама/i.test(res) && /my\s+name\s+is/i.test(fixed));
  if(bad){
    const alt=await myMemoryTranslate(fixed,sl,tl);
    if(alt) res=alt;
  }
  res=postProcess(fixed,res,sl,tl);
  cache.current.set(key,res); return res;
}

useEffect(()=>{
  if(timer.current) clearTimeout(timer.current);
  if(!input.trim()){setOutput("");return;}
  timer.current=setTimeout(async()=>{ setLoading(true); const r=await translate(input,from,to); if(r) setOutput(r); setLoading(false); },300);
},[input,from,to]);

const handleInputChange=(e)=>{
  let v=e.target.value;
  if(v.length>MAX_CHARS) v=v.slice(0,MAX_CHARS);
  setInput(v);
};
const applyCorrection=(idx,corrected)=>{
  const newTokens=[...tokens];
  newTokens[idx].text=corrected;
  const newText=newTokens.map(t=>t.text).join("");
  setInput(newText.slice(0,MAX_CHARS));
};

const handleCopy=async(t,id)=>{
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); ok=true; } }catch{}
  if(!ok){
    try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.left="-9999px"; document.body.appendChild(ta); ta.focus(); ta.select(); ok=document.execCommand("copy"); document.body.removeChild(ta); }catch{}
  }
  if(ok){ setCopy(id); setTimeout(()=>setCopy(null),1500); }
};
const speak=(text,code,id)=>{
  if(!text) return;
  if(speaking===id){ speechSynthesis.cancel(); setSpeaking(null); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=code==="kk"?"ru-RU":code; u.onend=()=>setSpeaking(null); u.onerror=()=>setSpeaking(null);
  setSpeaking(id); setTimeout(()=>speechSynthesis.speak(u),50);
};

const bg=isDark?"#0c0e12":"#f5f7fb"; const cardBg=isDark?"#171a21":"#ffffff"; const border=isDark?"#262a33":"#e6e8ee";
const txt=isDark?"#e8eaf0":"#1d2330"; const muted=isDark?"#8b93a3":"#7a8191"; const blue="#2563ff"; const blueSoft=isDark?"#1a2744":"#eaf2ff";
const countClass = input.length>4800 ? (input.length>=MAX_CHARS?"over":"warn") : "ok";

return (
<div style={{background:bg,color:txt,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center"}}>
  <header style={{width:"100%",maxWidth:1160,padding:"0 20px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <img src={LOGO} alt="logo" style={{width:40,height:40,borderRadius:10}}/>
      <div style={{fontWeight:800,fontSize:19}}>LumiTranslate</div>
    </div>
    <button onClick={()=>setTheme(isDark?"light":"dark")} className="pill" style={{width:40,height:40,borderRadius:9999,border:`1px solid ${border}`,background:cardBg,color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{isDark?"☀":"🌙"}</button>
  </header>

  <main style={{width:"100%",maxWidth:1160,padding:"8px 16px 10px"}}>
    <div style={{width:"100%",background:cardBg,border:`1px solid ${border}`,borderRadius:22,overflow:"hidden",boxShadow:isDark?"none":"0 12px 40px rgba(16,24,40,.08)"}}>
      <div style={{display:"flex",width:"100%",alignItems:"stretch",position:"relative",borderBottom:`1px solid ${border}`}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:0,padding:"0 10px",height:52,overflowX:"auto"}}>
          {POP_FROM.map(code=>{ const l=LANGS.find(x=>x.code===code); return <button key={code} onClick={()=>setFrom(code)} className={"tab pill "+(from===code?"active":"")} style={{padding:"0 12px",height:"100%",border:"none",background:"transparent",color:from===code?blue:muted,fontSize:14}}>{l?.native||code}</button> })}
          <button onClick={()=>{setPicker("from");setSearch("");}} className="pill" style={{marginLeft:6,display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,fontSize:12,fontWeight:600}}>Еще <IconDown/></button>
        </div>
        <button onClick={()=>{const a=from;setFrom(to);setTo(a);setInput(output);setOutput(input);}} className="pill" style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:40,height:40,borderRadius:9999,border:`1px solid ${border}`,background:cardBg,color:blue,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}><IconSwap/></button>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:0,padding:"0 10px 0 52px",height:52,overflowX:"auto"}}>
          {POP_TO.map(code=>{ const l=LANGS.find(x=>x.code===code); return <button key={code} onClick={()=>setTo(code)} className={"tab pill "+(to===code?"active":"")} style={{padding:"0 12px",height:"100%",border:"none",background:"transparent",color:to===code?blue:muted,fontSize:14}}>{l?.native||code}</button> })}
          <button onClick={()=>{setPicker("to");setSearch("");}} className="pill" style={{marginLeft:6,display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,fontSize:12,fontWeight:600}}>Еще <IconDown/></button>
        </div>
      </div>

      {tokens.some(t=>!t.isSpace && t.corr && t.corr.isTypo) && (
        <div className="suggestion-bar">
          {tokens.map((t,i)=>{
            if(t.isSpace) return <span key={i}>{t.text}</span>;
            if(t.corr && t.corr.isTypo){
              return (
                <span key={i} className="word-wrap" onClick={()=>applyCorrection(i,t.corr.fixed)}>
                  <span className="suggest">{t.corr.suggestion || t.corr.fixed}</span>
                  <span className="typo">{t.text}</span>
                </span>
              );
            }
            return <span key={i} style={{margin:"0 2px"}}>{t.text}</span>;
          })}
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",minHeight:360}}>
        <div style={{position:"relative",display:"flex",flexDirection:"column",borderRight:`1px solid ${border}`}}>
          <textarea value={input} onChange={handleInputChange} maxLength={MAX_CHARS} placeholder="Введите текст..." style={{flex:1,minHeight:260,padding:"20px 20px 64px",background:"transparent",border:"none",outline:"none",resize:"none",fontSize:20,lineHeight:1.5,color:txt}}/>
          {input && <button onClick={()=>setInput("")} className="pill" style={{position:"absolute",top:14,right:14,width:28,height:28,borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconX/></button>}
          <div style={{height:1,background:border}}></div>
          <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>speak(input,from,"in")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:speaking==="in"?blue:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="in"}/></button>
              <button onClick={()=>handleCopy(input,"in")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${copy==="in"?blue:border}`,background:copy==="in"?blueSoft:cardBg,color:copy==="in"?blue:muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="in"?<IconCheck/>:<IconCopy/>}</button>
            </div>
            <span className={`counter ${countClass}`}>{input.length} / {MAX_CHARS}</span>
          </div>
        </div>
        <div style={{position:"relative",display:"flex",flexDirection:"column",background:output?blueSoft:"transparent"}}>
          <div style={{flex:1,padding:"20px",overflow:"auto"}}>
            {loading ? <div style={{color:blue,fontWeight:600,fontSize:14}}>Переводим...</div> : output ? <div style={{fontSize:20,lineHeight:1.55,whiteSpace:"pre-wrap"}}>{output}</div> : <span style={{color:muted,fontSize:20}}>Перевод</span>}
          </div>
          <div style={{height:1,background:border}}></div>
          <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>speak(output,to,"out")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:blue,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="out"}/></button>
              <button onClick={()=>handleCopy(output,"out")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:blue,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="out"?<IconCheck/>:<IconCopy/>}</button>
            </div>
            <span style={{fontSize:11,fontWeight:700,color:blue,background:cardBg,border:`1px solid ${blue}`,padding:"4px 8px",borderRadius:9999}}>{to.toUpperCase()}</span>
          </div>
        </div>
      </div>
    </div>
    <div style={{textAlign:"center",marginTop:14,fontSize:12,color:muted,lineHeight:1.5}}>
      Это переводчик, он может ошибаться. Проверяйте важные переводы.<br/>
      <span style={{fontSize:11}}>300 языков •  • Лимит 5000 символов</span>
    </div>
  </main>

  {picker && (
    <div style={{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{position:"absolute",inset:0,background:"rgba(12,14,18,0.4)",backdropFilter:"blur(10px)"}} onClick={()=>setPicker(null)}></div>
      <div style={{position:"relative",width:"100%",maxWidth:480,maxHeight:"80vh",borderRadius:20,background:cardBg,border:`1px solid ${border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:14,borderBottom:`1px solid ${border}`,display:"flex",gap:10,alignItems:"center"}}>
          <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск 300 языков..." style={{flex:1,height:42,padding:"0 14px",borderRadius:12,border:`1px solid ${blue}`,background:blueSoft,color:txt,outline:"none"}}/>
          <span style={{fontSize:11,color:muted}}>{filtered.length} / 300</span>
          <button onClick={()=>setPicker(null)} className="pill" style={{width:42,height:42,borderRadius:12,border:`1px solid ${border}`,background:cardBg}}><IconX/></button>
        </div>
        <div style={{flex:1,overflow:"auto",padding:8,display:"grid",gap:4}}>
          {filtered.map(l=>{const active=(picker==="from"?from:to)===l.code;return <button key={l.code+l.native} onClick={()=>{if(picker==="from")setFrom(l.code);else setTo(l.code);setPicker(null);}} className="pill" style={{textAlign:"left",padding:"12px 14px",borderRadius:12,background:active?blueSoft:cardBg,border:`1px solid ${active?blue:border}`,display:"flex",justifyContent:"space-between"}}><span><b style={{color:active?blue:txt}}>{l.native}</b> <span style={{color:muted,fontSize:12}}>• {l.name}</span></span><span style={{fontSize:11,fontWeight:800}}>{l.code.toUpperCase()}</span></button>})}
        </div>
      </div>
    </div>
  )}
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
