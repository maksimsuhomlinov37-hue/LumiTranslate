const [output,setOutput]=useState("Добро пожаловать в LumiTranslate");
const [loading,setLoading]=useState(false);
const [copy,setCopy]=useState(null);
const [speaking,setSpeaking]=useState(null);
const [voices,setVoices]=useState([]);
const [showUpdate,setShowUpdate]=useState(false);
const [picker,setPicker]=useState(null);
const [search,setSearch]=useState("");
const cache=useRef(new Map());
const timer=useRef(null);
const ctrl=useRef(null);
const isDark=theme==="dark";

useEffect(()=>{
  const load=()=>setVoices(speechSynthesis.getVoices());
  load(); speechSynthesis.onvoiceschanged=load;
  const seen=localStorage.getItem("lumitranslate_update_3.0_seen");
  if(!seen) setTimeout(()=>setShowUpdate(true),600);
},[]);

const filtered=useMemo(()=>{
  const q=search.toLowerCase().trim();
  if(!q) return LANGS;
  return LANGS.filter(l=>l.code.includes(q)||l.name.toLowerCase().includes(q)||l.native.toLowerCase().includes(q));
},[search]);

async function translate(text,sl,tl,signal){
  if(!text.trim()) return "";
  const key=`${sl}|${tl}|${text}`;
  if(cache.current.has(key)) return cache.current.get(key);
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const r=await fetch(url,{signal});
    const j=await r.json();
    const res=j[0].map(x=>x[0]).join("");
    cache.current.set(key,res);
    return res;
  }catch(e){return "";}
}

useEffect(()=>{
  if(timer.current) clearTimeout(timer.current);
  if(ctrl.current) ctrl.current.abort();
  if(!input.trim()){setOutput("");return;}
  const k=`${from}|${to}|${input}`;
  if(cache.current.has(k)){setOutput(cache.current.get(k));return;}
  timer.current=setTimeout(async()=>{
    const c=new AbortController(); ctrl.current=c;
    setLoading(true);
    const res=await translate(input,from,to,c.signal);
    if(res) setOutput(res);
    setLoading(false);
  },280);
},[input,from,to]);

const handleCopy=async(t,id)=>{
  try{
    let ok=false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(t);
        ok=true;
      }
    }catch(e){}
    if(!ok){
      const ta=document.createElement("textarea");
      ta.value=t;
      ta.style.position="fixed";
      ta.style.left="-9999px";
      document.body.appendChild(ta);
      ta.select();
      ok=document.execCommand("copy");
      document.body.removeChild(ta);
    }
    if(ok){
      setCopy(id);
      setTimeout(()=>setCopy(null),1600);
    }
  }catch(e){}
};
const getVoice=(code)=>{
  if(!voices.length) return null;
  const base=code.split("-")[0];
  let list=voices.filter(v=>v.lang.toLowerCase().startsWith(base));
  if(code==="kk" && list.length===0) list=voices.filter(v=>v.lang.toLowerCase().startsWith("ru"));
  return list[0] || null;
};
const speak=(text,code,id)=>{
  if(!text) return;
  if(speaking===id){ speechSynthesis.cancel(); setSpeaking(null); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const voice=getVoice(code);
  if(voice){ u.voice=voice; u.lang=voice.lang; } else u.lang=code;
  u.onend=()=>setSpeaking(null); u.onerror=()=>setSpeaking(null);
  setSpeaking(id); speechSynthesis.speak(u);
};

const bg=isDark?"#0c0e12":"#f5f7fb";
const cardBg=isDark?"#171a21":"#ffffff";
const border=isDark?"#262a33":"#e6e8ee";
const txt=isDark?"#e8eaf0":"#1d2330";
const muted=isDark?"#8b93a3":"#7a8191";
const blue="#1E7EFF";
const blueSoft=isDark?"#1a2a4a":"#eaf2ff";

return (
<div style={{background:bg,color:txt,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center"}}>
  <header style={{width:"100%",maxWidth:1160,padding:"0 20px",height:64,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <img src={LOGO} alt="LumiTranslate Logo" style={{width:44,height:44,objectFit:"contain",display:"block",borderRadius:8}} />
      <div style={{display:"flex",flexDirection:"column",lineHeight:1.1}}>
        <span style={{fontWeight:800,fontSize:18,letterSpacing:"-0.02em",display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:blue,border:"1.5px solid "+blue,borderRadius:6,padding:"1px 6px",fontSize:12,fontWeight:800}}>LumiTranslate</span>
        </span>
        <span style={{fontSize:13,color:muted,marginTop:4,display:"flex",alignItems:"center",gap:6}}><span style={{width:2,height:14,background:blue,borderRadius:2,display:"inline-block"}}></span>Переводчик &nbsp; <span style={{fontSize:11,background:isDark?"#212531":"#eef1f6",padding:"2px 6px",borderRadius:6}}>130+ языков</span></span>
      </div>
    </div>
    <button onClick={()=>setTheme(isDark?"light":"dark")} className="pill" style={{width:40,height:40,borderRadius:9999,border:`1px solid ${border}`,background:cardBg,color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{isDark?"☀":"🌙"}</button>
  </header>

  <main style={{width:"100%",maxWidth:1160,padding:"8px 16px 40px",display:"flex",flexDirection:"column",gap:14}}>
    <div style={{width:"100%",background:cardBg,border:`1px solid ${border}`,borderRadius:20,overflow:"hidden",boxShadow:isDark?"none":"0 8px 30px rgba(16,24,40,0.06)"}}>

      <div style={{display:"flex",width:"100%",alignItems:"stretch",position:"relative",borderBottom:`1px solid ${border}`}}>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:0,padding:"0 12px",height:52,overflowX:"auto",scrollbarWidth:"none"}}>
          {POP_FROM.map(code=>{
            const l=[...LANGS].find(x=>x.code===code);
            return <button key={code} onClick={()=>setFrom(code)} className={"tab pill "+(from===code?"active":"")} style={{padding:"0 12px",height:"100%",border:"none",background:"transparent",color:from===code?blue:muted,fontSize:14,fontWeight:from===code?700:500}}>{l?.native||code}</button>
          })}
          <button onClick={()=>{setPicker("from");setSearch("");}} className="pill" style={{marginLeft:6,display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,fontSize:12,fontWeight:600}}><span>Еще</span><IconDown/></button>
        </div>

        <button onClick={()=>{setFrom(to);setTo(from);const t=input;setInput(output);setOutput(t);}} className="pill" style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",width:40,height:40,borderRadius:9999,border:`1px solid ${border}`,background:cardBg,color:blue,display:"flex",alignItems:"center",justifyContent:"center",zIndex:2}}><IconSwap/></button>

        <div style={{flex:1,display:"flex",alignItems:"center",gap:0,padding:"0 12px 0 52px",height:52,overflowX:"auto",scrollbarWidth:"none"}}>
          {POP_TO.map(code=>{
            const l=[...LANGS].find(x=>x.code===code);
            return <button key={code} onClick={()=>setTo(code)} className={"tab pill "+(to===code?"active":"")} style={{padding:"0 12px",height:"100%",border:"none",background:"transparent",color:to===code?blue:muted,fontSize:14,fontWeight:to===code?700:500}}>{l?.native||code}</button>
          })}
          <button onClick={()=>{setPicker("to");setSearch("");}} className="pill" style={{marginLeft:6,display:"flex",alignItems:"center",gap:4,padding:"6px 10px",borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,fontSize:12,fontWeight:600}}><span>Еще</span><IconDown/></button>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",minHeight:320}}>
        <div style={{position:"relative",display:"flex",flexDirection:"column",borderRight:`1px solid ${border}`}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="Введите текст..." style={{flex:1,minHeight:220,padding:"20px 20px 64px",background:"transparent",border:"none",outline:"none",resize:"none",fontSize:20,lineHeight:1.5,color:txt}}/>
          {input && <button onClick={()=>setInput("")} className="pill" style={{position:"absolute",top:14,right:14,width:28,height:28,borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconX/></button>}
          <div style={{height:1,background:border}}></div>
          <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>speak(input,from,"in")} className={"pill "+(speaking==="in"?"speaking":"")} style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="in"}/></button>
              <button onClick={()=>handleCopy(input,"in")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${copy==="in"?blue:border}`,background:copy==="in"?blueSoft:cardBg,color:copy==="in"?blue:muted,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="in"?<IconCheck/>:<IconCopy/>}</button>
            </div>
            <span style={{fontSize:11,fontWeight:600,color:muted,background:isDark?"#212531":"#f2f4f8",padding:"4px 8px",borderRadius:9999}}>{input.length} символов</span>
          </div>
        </div>

        <div style={{position:"relative",display:"flex",flexDirection:"column",background:output? blueSoft : "transparent"}}>
          <div style={{flex:1,padding:"20px",overflow:"auto"}}>
            {loading ? <div style={{display:"flex",alignItems:"center",gap:10,color:blue,fontSize:14,fontWeight:600}}>Переводим...</div> :
             output ? <div className="fade" style={{fontSize:20,lineHeight:1.55,whiteSpace:"pre-wrap"}}>{output}</div> :
             <span style={{color:muted,fontSize:20}}>Перевод</span>}
          </div>
          <div style={{height:1,background:border}}></div>
          <div style={{padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>speak(output,to,"out")} className={"pill "+(speaking==="out"?"speaking":"")} style={{width:38,height:38,borderRadius:12,border:`1px solid ${border}`,background:cardBg,color:blue,display:"flex",alignItems:"center",justifyContent:"center"}}><IconVolume s={speaking==="out"}/></button>
              <button onClick={()=>handleCopy(output,"out")} className="pill" style={{width:38,height:38,borderRadius:12,border:`1px solid ${copy==="out"?blue:border}`,background:cardBg,color:copy==="out"?blue:blue,display:"flex",alignItems:"center",justifyContent:"center"}}>{copy==="out"?<IconCheck/>:<IconCopy/>}</button>
            </div>
            <span style={{fontSize:11,fontWeight:700,color:blue,background:cardBg,border:`1px solid ${blue}`,padding:"4px 8px",borderRadius:9999}}>{to.toUpperCase()}</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  {showUpdate && (
    <div style={{position:"fixed",inset:0,zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{position:"absolute",inset:0,background:"rgba(12,14,18,0.5)",backdropFilter:"blur(12px)"}} onClick={()=>{localStorage.setItem("lumitranslate_update_3.0_seen","true");setShowUpdate(false);}}></div>
      <div style={{position:"relative",width:"100%",maxWidth:380,borderRadius:24,background:cardBg,border:`1px solid ${border}`,boxShadow:"0 24px 60px rgba(0,0,0,0.28)",overflow:"hidden",animation:"slideUp .4s"}}>
        <div style={{padding:"24px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <img src={LOGO} style={{width:36,height:36,objectFit:"contain"}} alt="logo"/>
            <h2 style={{margin:0,fontSize:18,fontWeight:800}}>Обновление 3.0</h2>
          </div>
          <button onClick={()=>{localStorage.setItem("lumitranslate_update_3.0_seen","true");setShowUpdate(false);}} className="pill" style={{width:30,height:30,borderRadius:9999,border:`1px solid ${border}`,background:isDark?"#212531":"#f2f4f8",display:"flex",alignItems:"center",justifyContent:"center"}}><IconX/></button>
        </div>
        <div style={{padding:"18px 24px",display:"flex",flexDirection:"column",gap:14,fontSize:14,lineHeight:1.6,color:txt}}>
          <div style={{color:muted}}>Мы изменили дизайн на синий. Также улучшили перевод и озвучку к нему.</div>
          <div style={{height:1,background:border}}></div>
          <div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>Поддержите нас</div>
            <a href="tel:+77753539530" style={{color:txt,fontWeight:700,textDecoration:"none",fontSize:15}}>+7 775 353 95 30</a>
          </div>
        </div>
        <div style={{padding:"0 24px 24px",display:"flex",flexDirection:"column",gap:10}}>
          <a href="https://wa.me/77753539530" target="_blank" style={{display:"flex",alignItems:"center",justifyContent:"center",height:46,borderRadius:14,background:blue,color:"white",fontWeight:700,fontSize:14,textDecoration:"none"}} className="pill">Написать в WhatsApp</a>
          <button onClick={()=>{localStorage.setItem("lumitranslate_update_3.0_seen","true");setShowUpdate(false);}} className="pill" style={{height:46,borderRadius:14,background:isDark?"#212531":"#f2f4f8",border:`1px solid ${border}`,color:txt,fontWeight:600,fontSize:14}}>Продолжить</button>
        </div>
      </div>
    </div>
  )}

  {picker && (
    <div style={{position:"fixed",inset:0,zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{position:"absolute",inset:0,background:"rgba(12,14,18,0.4)",backdropFilter:"blur(10px)"}} onClick={()=>setPicker(null)}></div>
      <div style={{position:"relative",width:"100%",maxWidth:440,maxHeight:"80vh",borderRadius:20,background:cardBg,border:`1px solid ${border}`,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{padding:14,borderBottom:`1px solid ${border}`,display:"flex",gap:10}}>
          <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск языка" style={{flex:1,height:42,padding:"0 14px",borderRadius:12,border:`1px solid ${blue}`,background:blueSoft,color:txt,outline:"none"}}/>
          <button onClick={()=>setPicker(null)} className="pill" style={{width:42,height:42,borderRadius:12,border:`1px solid ${border}`,background:cardBg}}><IconX/></button>
        </div>
        <div style={{flex:1,overflow:"auto",padding:8,display:"grid",gap:4}}>
          {filtered.map(l=>{const active=(picker==="from"?from:to)===l.code;return <button key={l.code+l.native} onClick={()=>{if(picker==="from")setFrom(l.code);else setTo(l.code);setPicker(null);}} className="pill" style={{textAlign:"left",padding:"12px 14px",borderRadius:12,background:active?blueSoft:cardBg,border:`1px solid ${active?blue:border}`,display:"flex",justifyContent:"space-between"}}><span><b style={{color:active?blue:txt}}>{l.native}</b> <span style={{color:muted,fontSize:12}}>• {l.name}</span></span><span style={{fontSize:11,fontWeight:800}}>{l.code.toUpperCase()}</span></button>})}
        </div>
      </div>
    </div>
  )}
</div>
);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
